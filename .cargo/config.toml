# The kernels select their SIMD path at compile time: SIMD128 (and relaxed SIMD when enabled) in
# wasm32, NEON `sdot` with the host CPU's features on aarch64. getrandom is routed to a
# deterministic in-crate backend so runtimes import no entropy source (the tokenizer only seeds
# hash maps with it).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128", "--cfg", 'getrandom_backend="custom"']

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

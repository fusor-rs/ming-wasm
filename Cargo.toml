[workspace]
members = ["crates/ming-runtime", "crates/ming-cli"]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/fusor-rs/ming-wasm"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
undocumented_unsafe_blocks = "deny"
[workspace.dependencies]
# fusor-ai, from the vendor/fusor-ai submodule at its pinned commit: the crates, the browser
# host scripts, the runtime build and the import check.
team = { package = "fusor-ai-team", path = "vendor/fusor-ai/crates/team" }
bundle = { package = "fusor-ai-bundle", path = "vendor/fusor-ai/crates/bundle" }
compile = { package = "fusor-ai-compile", path = "vendor/fusor-ai/crates/compile" }
runtime = { package = "fusor-ai-runtime", path = "vendor/fusor-ai/crates/runtime" }
ming = { package = "fusor-ai-ming", path = "vendor/fusor-ai/crates/models/ming" }
ming-compile = { package = "fusor-ai-ming-compile", path = "vendor/fusor-ai/crates/models/ming-compile" }
rayon = "=1.12.0"
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
# tokenizers and the kernels are unusably slow unoptimised; optimise them even in dev builds.
opt-level = 3
debug = false

[profile.release]
debug = false

# Browser runtimes (vendor/fusor-ai/scripts/build-runtime.sh): speed, fat LTO for size, abort on panic.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
